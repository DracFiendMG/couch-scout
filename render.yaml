services:
  - type: web
    name: couch-scout
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: GEMMA_PROVIDER
        value: openai-compatible
      - key: GEMMA_MODEL
        value: gemma2-9b-it
      - key: GEMMA_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GEMMA_API_KEY
        sync: false
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: BROWSERBASE_PROJECT_ID
        sync: false
      - key: STAGEHAND_HEADLESS
        value: "true"
      - key: TEMPORAL_ENABLED
        value: "false"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
